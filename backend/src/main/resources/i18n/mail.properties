# Mail templates (MessageFormat: write a literal apostrophe as two apostrophes). English is the default.
mail.otp.subject=Your Qiao sign-in code: {0}
mail.otp.body=Your Qiao sign-in code is {0}.\n\nIt expires in {1} minutes. If you did not request it, you can ignore this email.
mail.company.approved.subject=Your company has been approved on Qiao
mail.company.approved.body=Good news: {0} has been approved. You can now submit projects for review.
mail.company.rejected.subject=Your company review on Qiao
mail.company.rejected.body=We could not approve {0}. Sign in to Qiao to see the review note and update your details.
mail.engineer.approved.subject=Your Qiao profile has been approved
mail.engineer.approved.body=Your profile {0} has been approved. You can now apply to open projects.
mail.engineer.rejected.subject=Your Qiao profile review
mail.engineer.rejected.body=Your profile {0} was not approved. Sign in to Qiao to see the review note, edit the profile and submit it again.
mail.project.approved.subject=Project published: {0}
mail.project.approved.body=Your project "{0}" has been approved and is now visible to engineers.
mail.project.rejected.subject=Project not approved: {0}
mail.project.rejected.body=Your project "{0}" was not approved. Sign in to Qiao to see the review note.
mail.project.changes.subject=Changes requested: {0}
mail.project.changes.body=Our team asked for changes to your project "{0}". Sign in to Qiao to see the note, edit the project and submit it again.
mail.application.hired.subject=You have been selected: {0}
mail.application.hired.body=You have been selected for the project "{0}". Sign in to Qiao to review and accept your deliverables agreement.
mail.milestone.funded.subject=Milestone funded: {0}
mail.milestone.funded.body=The milestone "{0}" of the project "{1}" has been funded. You can start working on the deliverable.
mail.milestone.submitted.subject=Deliverable submitted: {0}
mail.milestone.submitted.body=The engineer submitted the deliverable for the milestone "{0}" of the project "{1}". Sign in to Qiao to accept it or request a revision.
mail.milestone.accepted.subject=Deliverable accepted: {0}
mail.milestone.accepted.body=The client accepted the milestone "{0}" of the project "{1}". It will be included in the next monthly settlement.
mail.milestone.revision.subject=Revision requested: {0}
mail.milestone.revision.body=The client requested a revision of the milestone "{0}" of the project "{1}":\n\n{2}
mail.team.invitation.subject=Team invitation: {0}
mail.team.invitation.body={1} invited you to join the team "{0}" on Qiao. Open the engineer app to accept or decline. In a team every member keeps an individual agreement and is paid individually.
