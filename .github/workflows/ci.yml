# CI de Qiao: compila y prueba las tres partes y el despliegue; en main publica las imágenes en Alibaba ACR
# (Hong Kong). Las imágenes se construyen fuera de China porque Docker Hub no funciona desde el continente.
# Variables y secrets que hacen falta: docs/OPERACIONES.md, «CI y GitHub».
name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior de ese PR; en main cada commit termina su corrida.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests (Testcontainers con MySQL 8.4)
        run: mvn -B -q verify
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web

  h5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: h5/package-lock.json }
      - name: Build y control de recursos externos (regla de acceso sin VPN)
        run: npm ci && npm run build && npm run check:external
        working-directory: h5

  # Scripts y configuración de deploy/: sintaxis de bash, Compose (las tres variantes), nginx y Caddy.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck (preinstalado en el runner)
        run: shellcheck -x deploy/*.sh deploy/test/*.sh
      - name: docker compose config (build, imágenes de ACR, SLB, monitoring)
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q
          QIAO_NAMESPACE=ci QIAO_IMAGE_TAG=ci docker compose -f docker-compose.yml -f docker-compose.images.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.slb.yml config -q
          docker compose --profile monitoring config -q
      - name: nginx -t con la plantilla de producción
        run: |
          docker run --rm -e BACKEND_UPSTREAM=backend:8080 -e NGINX_PORT=80 \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" nginx:1.28-alpine \
            sh -c '/docker-entrypoint.sh nginx -t'
      - name: caddy validate
        run: |
          docker run --rm -e DOMAIN=qiao.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  e2e:
    needs: [backend, web, h5]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            h5/package-lock.json
            e2e/package-lock.json
      # El runner tiene Docker (MySQL y Nginx corren en contenedores). Como /opt/pw-browsers no existe aquí,
      # scripts/e2e.sh instala Chromium con «npx playwright install --with-deps chromium» (usa sudo, disponible).
      - name: Flujo completo de punta a punta
        run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # Publica qiao-backend y qiao-nginx con el tag = sha del commit. Sólo en main y sólo si el repositorio tiene
  # las variables ACR_REGISTRY y ACR_NAMESPACE (Settings → Secrets and variables → Actions → Variables);
  # los secrets ACR_USERNAME y ACR_PASSWORD se comprueban en el primer paso.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ACR_REGISTRY != '' && vars.ACR_NAMESPACE != ''
    needs: [e2e, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}
      TAG: ${{ github.sha }}
    steps:
      - name: Comprobar secrets de ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Faltan los secrets ACR_USERNAME y/o ACR_PASSWORD (ver docs/OPERACIONES.md)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Backend
        run: |
          docker build --pull --build-arg "APP_COMMIT=$TAG" -t "$IMAGE_PREFIX/qiao-backend:$TAG" backend
          docker push "$IMAGE_PREFIX/qiao-backend:$TAG"
      - name: Nginx con web y H5
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$TAG" -f deploy/nginx/Dockerfile -t "$IMAGE_PREFIX/qiao-nginx:$TAG" .
          docker push "$IMAGE_PREFIX/qiao-nginx:$TAG"
      - name: Cómo desplegar
        run: |
          {
            echo "### Imágenes publicadas"
            echo "- \`$IMAGE_PREFIX/qiao-backend:$TAG\`"
            echo "- \`$IMAGE_PREFIX/qiao-nginx:$TAG\`"
            echo
            echo "En el servidor: \`sudo /opt/qiao/deploy/update.sh $TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
