# CI de Qiao: compila y prueba las tres partes; en main publica las imágenes en Alibaba ACR (Hong Kong).
# Las imágenes se construyen fuera de China porque Docker Hub no funciona desde el continente.
name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests (Testcontainers con MySQL 8.4)
        run: mvn -B -q verify
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
        working-directory: web

  h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: h5/package-lock.json }
      - name: Build y control de recursos externos (regla de acceso sin VPN)
        run: npm ci && npm run build && npm run check:external
        working-directory: h5

  e2e:
    needs: [backend, web, h5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Flujo completo de punta a punta
        run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-report, path: e2e/test-results }

  images:
    if: github.ref == 'refs/heads/main' && vars.ACR_REGISTRY != ''
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Backend
        run: |
          docker build -t ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/qiao-backend:${{ github.sha }} backend
          docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/qiao-backend:${{ github.sha }}
      - name: Nginx con web y H5
        run: |
          docker build -f deploy/nginx/Dockerfile -t ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/qiao-nginx:${{ github.sha }} .
          docker push ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/qiao-nginx:${{ github.sha }}
