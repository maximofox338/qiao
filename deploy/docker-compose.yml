# Qiao fase 1 — un solo servidor (ECS) en Alibaba Cloud Hong Kong. Guía completa: docs/OPERACIONES.md
#
#   Internet ──80/443──> caddy (HTTPS automático) ──> nginx (web /, H5 /m/, API /api/) ──> backend ──> mysql
#
# Instalación: deploy/install.sh (crea .env y arranca todo). A mano: cp .env.example .env && docker compose up -d --build
# Variantes (se eligen con COMPOSE_FILE en .env, ver .env.example):
#   docker-compose.images.yml  imágenes construidas en CI y publicadas en Alibaba ACR (sin compilar en el servidor)
#   docker-compose.slb.yml     TLS en un SLB de Alibaba con certificado, sin Caddy
# Perfil opcional "monitoring" (COMPOSE_PROFILES=monitoring): Uptime Kuma sólo en 127.0.0.1:3001.
name: qiao

# Logs de Docker con rotación: como máximo 5 archivos de 10 MB por contenedor (docker compose logs los lee).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qiao
      MYSQL_USER: ${DB_USER:-qiao}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ = la variable la expande el contenedor (la contraseña no queda escrita en la configuración).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging: *logging

  backend:
    # En modo build la imagen se construye aquí y se etiqueta con QIAO_IMAGE_TAG (lo maneja update.sh),
    # así una versión anterior queda disponible para volver atrás.
    image: qiao-backend:${QIAO_IMAGE_TAG:-local}
    # QIAO_BUILD_COMMIT lo pasa update.sh (o install.sh) al compilar: GET /api/health lo muestra como "commit".
    build: { context: ../backend, args: { APP_COMMIT: "${QIAO_BUILD_COMMIT:-unknown}" } }
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/qiao?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
      # Mismo directorio que crea (con permisos del usuario qiao) la imagen del backend.
      STORAGE_LOCAL_DIR: /data/uploads
      # Heap al 60 % del límite de memoria y reinicio limpio si se agota (Docker lo vuelve a levantar).
      JAVA_OPTS: -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC
      # Variables de .env que el backend no necesita: no se le pasan.
      MYSQL_ROOT_PASSWORD: ""
      BACKUP_OSS_ACCESS_KEY_SECRET: ""
    volumes:
      - files:/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s
    mem_limit: 1536m
    logging: *logging

  nginx:
    image: qiao-nginx:${QIAO_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/nginx/Dockerfile }
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8080
    # Sin puertos publicados: sólo Caddy (o el SLB, ver docker-compose.slb.yml) llega a nginx.
    depends_on: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requerido (p. ej. qiao.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL requerido (avisos de Let's Encrypt)}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nginx]
    healthcheck:
      # API de administración de Caddy, sólo accesible dentro del contenedor.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    logging: *logging

  # Monitoreo propio opcional (COMPOSE_PROFILES=monitoring en .env). Sólo escucha en 127.0.0.1:
  # se abre con un túnel SSH (ssh -L 3001:127.0.0.1:3001 root@IP) y http://localhost:3001.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    mem_limit: 512m
    logging: *logging

volumes:
  mysql-data:
  files:
  caddy-data:
  caddy-config:
  uptime-kuma-data:
